<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book · GCTU Bookshop</title>
<meta name="description" content="GCTU Bookshop: a student concept demo of an online bookshop for university students and lecturers. Not an official GCTU service.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c2957">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/fraunces-normal-latin-48642176.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/dm-sans-normal-latin-c57593e0.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/app.js" defer></script>
</head>
<body data-page="book">
<a class="skip" href="#main">Skip to content</a>
<div id="site-top"></div>
<main id="main">
  <div class="wrap" id="book-main">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="bookpage">
      <div class="cover-wrap" id="book-cover"></div>
      <div>
        <p class="eyebrow" id="b-genre"></p>
        <h1 id="b-title"></h1>
        <p class="byline" id="b-by"></p>
        <div class="seg" id="seg" data-v="hard" role="group" aria-label="Choose format">
          <span class="pill" aria-hidden="true"></span>
          <button type="button" data-v="hard" aria-pressed="true">Hard copy</button>
          <button type="button" data-v="ebook" aria-pressed="false">E-book</button>
        </div>
        <div class="bigprice" id="bigprice" aria-live="polite"></div>
        <p class="hint" id="hint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f4185" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="hint-t">Students get an extra 10% off at checkout after signing in with a student ID.</span></p>
        <ul class="ship" id="ship"></ul>
        <div class="acts">
          <button class="btn navy" type="button" data-later="buy">Add to cart <span class="arr" aria-hidden="true">→</span></button>
          <button class="btn line" type="button" data-later="buy">♡ Wishlist</button>
        </div>
        <div class="about"><h2>About this book</h2><p id="b-blurb"></p></div>
        <div class="facts" id="facts"></div>
        <p class="licence" id="licence"></p>
      </div>
    </div>
    <section class="section" aria-labelledby="more-title">
      <div class="s-head"><div><h2 id="more-title">More books</h2></div><div class="progress" aria-hidden="true"><i></i></div></div>
      <div id="shelf-more"></div>
    </section>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
