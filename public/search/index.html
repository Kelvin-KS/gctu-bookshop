      <input id="q" name="q" type="search" placeholder="Title, author, genre or course code" autocomplete="off">
    </form>
    <div class="sugg"><span>Try:</span><a href="/search/?q=STAT%20201">STAT 201</a><a href="/search/?q=Doyle">Doyle</a><a href="/search/?q=Wells">Wells</a><a href="/search/?q=Things%20Fall%20Apart">Things Fall Apart</a></div>

  </div>
